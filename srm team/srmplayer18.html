<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMVKC - Karthik R</title>
<link rel="stylesheet" href="srmplayer1.css">
</head>
<body>

  <section class="player-page">

    

    <!-- ===== TOP HEADER - LOGO + TITLE ===== -->
    <div class="page-header">
      <div class="club-logo">
        <div class="logo-icon">🦁</div>
        <span class="club-name-sm">SRM</span>
        <span class="club-sub-sm">KABADDI TEAM</span>
      </div>

      <div class="page-title">
        <h1 class="title-main">SRM</h1>
        <p class="title-sub">TEAM COACH</p>
      </div>
    </div>

    <!-- ===== MAIN CONTENT - PHOTO + INFO ===== -->
    <div class="player-content">

      <!-- LEFT / TOP - Player photo -->
      <div class="photo-box">
        <img class="player-photo" src="player18.jpeg" alt="Karthik R">
      </div>

      <!-- RIGHT / BOTTOM - Player info -->
      <div class="info-box">

        <div class="info-row">
          <div class="info-icon">👤</div>
          <div class="info-text">
            <span class="info-label">NAME:</span>
            <span class="info-value">DURGA</span>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">🎂</div>
          <div class="info-text">
            <span class="info-label">DATE OF BIRTH:</span>
            <span class="info-value"> </span>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">🏃</div>
          <div class="info-text">
            <span class="info-label">POSITION:</span>
            <span class="info-value highlight">RIGHT CORNER</span>
          </div>
        </div>

        <div class="info-row achievements-row">
          <div class="info-icon">🏆</div>
          <div class="info-text">
            <span class="info-label">ACHIEVEMENTS:</span>
            <ul class="achv-list">
              <li><span class="star">★</span> DISTICK AND STATE LEVEL PLAYER</li>
              <li><span class="star">★</span> </li>
              <li><span class="star">★</span> </li>
              <li><span class="star">★</span> </li>
            </ul>
          </div>
        </div>

      </div>

    </div>

  </section>

  <script src="srmplayer1.js"></script>
</body>
</html>
